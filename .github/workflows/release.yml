name: Build Windows client
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm dist
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path release/QMX-Notebook-win32-x64 -DestinationPath release/QMX-Notebook-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QMX-Notebook-Windows-x64
          path: |
            release/QMX-Notebook-Windows-x64.zip
            release/installer/QMX-Notebook-Setup-*.exe
      - name: Attach to draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/QMX-Notebook-Windows-x64.zip
            release/installer/QMX-Notebook-Setup-*.exe
